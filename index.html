<body class="intro-open date-locked" data-event-date="2027-01-23T20:30:00-03:00">
  <!-- Intro -->
  <section class="intro" aria-labelledby="intro-title">
    <div class="intro__card">
      <p class="intro__eyebrow">MIS XV</p>
      <h1 id="intro-title" class="intro__name">Camila</h1>
      <div class="divider" aria-hidden="true"><span></span></div>
      <p class="intro__date">23 · 01 · 2027</p>
      <p class="intro__question">¿Cómo querés entrar?</p>
      <div class="intro__actions">
        <button type="button" class="intro__btn intro__btn--music" data-enter-with-music><span aria-hidden="true">♪</span> ENTRAR CON MÚSICA</button>
        <button type="button" class="intro__btn" data-enter-without-music>ENTRAR SIN MÚSICA</button>
      </div>
    </div>
  </section>

  <!-- Piezas de 941×1672 (Bloomkeep: 992×1586). Coordenadas de los botones en % de cada pieza -->

    <section class="panel panel--cover" aria-label="Portada: Mis XV, Camila">
      <img src="assets/01-portada.jpg" alt="Mis XV, Camila" width="941" height="1672" fetchpriority="high">
    </section>

    <!-- 2. Invitados (nombres y lugares desde ?invite=) -->
    <section class="panel guests" data-petalos aria-labelledby="nombres-invitados">
      <img id="imagen-invitados" src="assets/02-invitados.jpg" alt="Esta invitación fue creada especialmente para vos. Me hace muy feliz compartir este momento con ustedes." width="941" height="1672" loading="lazy" decoding="async">
      <div class="guests__content">
        <h2 id="nombres-invitados" class="guests__names"></h2>
      </div>
      <p id="cantidad-lugares" class="guest-places"></p>
    </section>

    <!-- 3. Cuenta regresiva -->
    <section class="panel" data-petalos aria-label="Cuenta regresiva">
      <img src="assets/03-cuenta-regresiva.jpg" alt="Faltan" width="941" height="1672" loading="lazy" decoding="async">
      <div class="countdown" aria-live="polite">
        <strong data-unit="days" aria-label="días">00</strong>
        <strong data-unit="hours" aria-label="horas">00</strong>
        <strong data-unit="minutes" aria-label="minutos">00</strong>
        <strong data-unit="seconds" aria-label="segundos">00</strong>
      </div>
    </section>

    <!-- 4. Fecha y hora (raspadita) -->

      <img src="assets/04-fecha.jpg" alt="Sábado 23 de enero de 2027, de 20:30 a 06:00 hs" width="941" height="1672" loading="lazy" decoding="async">
      <a class="hotspot hotspot--calendar" data-calendar target="_blank" rel="noopener noreferrer" aria-label="Agregar los XV de Camila al calendario">AGREGAR AL CALENDARIO</a>
      <div class="scratch" aria-label="Raspá para descubrir la fecha">
        <canvas class="scratch__canvas" aria-hidden="true"></canvas>
      </div>
    </section>

    <!-- 5. Cómo llegar -->
    <section class="panel" data-petalos aria-label="Cómo llegar">
      <img src="assets/05-como-llegar.jpg" alt="Cómo llegar: TRAPEMN, Butaco" width="941" height="1672" loading="lazy" decoding="async">
      <a class="hotspot hotspot--location" href="https://maps.app.goo.gl/Nr65C8xhVBESsyG17" target="_blank" rel="noopener noreferrer" aria-label="Ver ubicación de TRAPEMN en Google Maps">VER UBICACIÓN</a>
    </section>

    <!-- 6. Dress code -->
    <section class="panel" aria-label="Dress code">
      <img src="assets/06-dress-code.jpg" alt="Dress code: elegante / elegante sport. Evitar celeste y turquesa." width="941" height="1672" loading="lazy" decoding="async">
    </section>

    <!-- 7. Música -->

      <a class="hotspot hotspot--music" href="https://open.spotify.com/playlist/1xDzF5f8LDnGjXEqvfTuYl" target="_blank" rel="noopener noreferrer" aria-label="Sugerir canción en la playlist de Spotify">SUGERIR CANCIÓN</a>
    </section>

    <!-- 8. Un poquito de mí -->
    <section class="gallery" data-petalos aria-labelledby="gallery-title">
      <div class="gallery__inner">
        <h2 id="gallery-title" class="gallery__title">Un poquito de mí</h2>
        <div class="divider" aria-hidden="true"><span></span></div>
        <div class="gallery__grid">
          <button class="polaroid" type="button" aria-label="Ver foto 1 de 6">
            <img src="assets/fotos/camila-02.jpg" alt="Camila con vestido negro y anteojos de corazón, caminando por un camino de álamos" width="1079" height="1609" loading="lazy" decoding="async" style="object-position: 50% 35%">
          </button>
          <button class="polaroid" type="button" aria-label="Ver foto 2 de 6">
            <img src="assets/fotos/camila-05.jpg" alt="Camila abrazando a su perrito blanco, en blanco y negro" width="1080" height="1517" loading="lazy" decoding="async" style="object-position: 50% 30%">

          </button>

    <section class="panel panel--gifts" data-petalos aria-label="Regalos">

      <button class="hotspot hotspot--envelope" type="button" data-open-gifts aria-label="Tocá la perla para ver los datos para transferencia"></button>
    </section>

    <!-- 10. Bloomkeep -->
    <section class="panel panel--camera" aria-label="Bloomkeep" style="aspect-ratio: 992 / 1586">

    </section>

    <!-- 11. Confirmación -->
    <section class="panel panel--rsvp" data-petalos aria-label="Confirmá tu asistencia">
      <img src="assets/10-confirmacion.jpg" alt="Confirmá tu asistencia. Tu presencia hará esta noche aún más especial. Confirmá antes del 19 de diciembre de 2026." width="941" height="1672" loading="lazy" decoding="async">
      <a id="boton-confirmar" class="hotspot hotspot--rsvp" target="_blank" rel="noopener noreferrer" aria-label="Confirmar asistencia a los XV de Camila">CONFIRMAR ASISTENCIA</a>

    <span class="audio-toggle__note" aria-hidden="true">♪</span>
  </button>

  <!-- Modal: Datos para transferencia (diseño en imagen + botones invisibles) -->

    <div class="img-modal__stage" style="aspect-ratio: 941 / 1672">
      <img src="assets/modal-transferencia.jpg" alt="" width="941" height="1672" decoding="async">
      <div class="sr-only">
        <h2 id="gift-modal-title">Datos para transferencia</h2>
        <p>Alias: SOFA.DUDA.OBOE. Titular: José Francisco Ramos. Banco: Santander.</p>
      </div>
      <button class="img-modal__hit" style="left:80.6%;top:14.6%;width:10.4%;height:5%;border-radius:50%" type="button" data-close aria-label="Cerrar"></button>
      <button class="img-modal__hit" style="left:14%;top:35.6%;width:72%;height:8%" type="button" data-copy="SOFA.DUDA.OBOE" data-msg="¡Alias copiado!" aria-label="Copiar alias SOFA.DUDA.OBOE"></button>

    </div>
  </dialog>

  <!-- Visor de fotos -->
  <dialog class="lightbox" aria-label="Fotos de Camila">
    <button class="lightbox__close" type="button" data-close-lightbox aria-label="Cerrar">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" data-prev-photo aria-label="Foto anterior">&#8249;</button>
    <figure class="lightbox__frame"><img class="lightbox__img" src="assets/fotos/camila-02.jpg" alt=""></figure>
    <button class="lightbox__nav lightbox__nav--next" type="button" data-next-photo aria-label="Foto siguiente">&#8250;</button>
  </dialog>
